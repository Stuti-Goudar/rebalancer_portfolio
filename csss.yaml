import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
import { Toaster } from "@/components/ui/toaster";
import { TooltipProvider } from "@/components/ui/tooltip";
import Layout from "@/components/Layout";
import Dashboard from "@/pages/Dashboard";
import NewPortfolio from "@/pages/NewPortfolio";
import PortfolioDetail from "@/pages/PortfolioDetail";
import Holdings from "@/pages/Holdings";
import Targets from "@/pages/Targets";
import Rebalance from "@/pages/Rebalance";
import NotFound from "@/pages/not-found";

const queryClient = new QueryClient({ defaultOptions: { queries: { retry: 1, staleTime: 30000 } } });

function Router() {
  return (
    <Layout>
      <Switch>
        <Route path="/" component={Dashboard} />
        <Route path="/portfolios/new" component={NewPortfolio} />
        <Route path="/portfolios/:id" component={PortfolioDetail} />
        <Route path="/portfolios/:id/holdings" component={Holdings} />
        <Route path="/portfolios/:id/targets" component={Targets} />
        <Route path="/portfolios/:id/rebalance" component={Rebalance} />
        <Route component={NotFound} />
      </Switch>
    </Layout>
  );
}

export default function App() {
  return (
    <QueryClientProvider client={queryClient}>
      <TooltipProvider>
        <WouterRouter base={import.meta.env.BASE_URL.replace(/\/$/, "")}>
          <Router />
        </WouterRouter>
        <Toaster />
      </TooltipProvider>
    </QueryClientProvider>
  );
}
import { Link, useLocation } from "wouter";
import { cn } from "@/lib/utils";
import { Home, BarChart3, TrendingUp } from "lucide-react";

const navItems = [
  { href: "/", label: "Portfolios", icon: Home },
  { href: "/about", label: "About", icon: BarChart3 },
];

export default function Layout({ children }: { children: React.ReactNode }) {
  const [location] = useLocation();
  return (
    <div className="min-h-screen bg-background flex flex-col">
      <header className="border-b border-border bg-sidebar sticky top-0 z-50">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex items-center justify-between h-14">
            <Link href="/" className="flex items-center gap-2.5">
              <div className="w-7 h-7 rounded bg-primary/20 border border-primary/30 flex items-center justify-center">
                <TrendingUp className="w-4 h-4 text-primary" />
              </div>
              <span className="font-semibold text-foreground text-sm">Portfolio Rebalancer</span>
            </Link>
            <nav className="flex items-center gap-1">
              {navItems.map(({ href, label, icon: Icon }) => (
                <Link
                  key={href}
                  href={href}
                  className={cn(
                    "flex items-center gap-1.5 px-3 py-1.5 rounded text-xs font-medium transition-colors",
                    location === href
                      ? "bg-primary/15 text-primary"
                      : "text-muted-foreground hover:text-foreground hover:bg-muted"
                  )}
                >
                  <Icon className="w-3.5 h-3.5" />
                  {label}
                </Link>
              ))}
            </nav>
          </div>
        </div>
      </header>
      <main className="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
        {children}
      </main>
    </div>
  );
}
export function formatCurrency(value: number, currency = "USD"): string {
  return new Intl.NumberFormat("en-US", { style: "currency", currency, minimumFractionDigits: 2 }).format(value);
}

export function formatPercent(value: number, decimals = 1): string {
  return `${value >= 0 ? "+" : ""}${value.toFixed(decimals)}%`;
}

export function formatNumber(value: number, decimals = 2): string {
  return new Intl.NumberFormat("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(value);
}
import { Link } from "wouter";
import { useListPortfolios, useDeletePortfolio, getListPortfoliosQueryKey } from "@workspace/api-client-react";
import { useQueryClient } from "@tanstack/react-query";
import { Button } from "@/components/ui/button";
import { Badge } from "@/components/ui/badge";
import { Skeleton } from "@/components/ui/skeleton";
import { Plus, TrendingUp, Trash2, ChevronRight } from "lucide-react";

export default function Dashboard() {
  const { data: portfolios, isLoading } = useListPortfolios();
  const deletePortfolio = useDeletePortfolio();
  const queryClient = useQueryClient();

  const handleDelete = async (id: number) => {
    if (!confirm("Delete this portfolio and all its data?")) return;
    await deletePortfolio.mutateAsync({ id });
    queryClient.invalidateQueries({ queryKey: getListPortfoliosQueryKey() });
  };

  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-xl font-semibold text-foreground">Portfolios</h1>
          <p className="text-sm text-muted-foreground mt-0.5">Manage and rebalance your investment portfolios</p>
        </div>
        <Button asChild size="sm">
          <Link href="/portfolios/new"><Plus className="w-3.5 h-3.5 mr-1.5" />New Portfolio</Link>
        </Button>
      </div>

      {isLoading ? (
        <div className="space-y-3">{[1,2,3].map(i => <Skeleton key={i} className="h-20 w-full rounded-lg" />)}</div>
      ) : !portfolios?.length ? (
        <div className="flex flex-col items-center justify-center py-20 border border-dashed border-border rounded-lg">
          <TrendingUp className="w-10 h-10 text-muted-foreground mb-3 opacity-50" />
          <h3 className="text-sm font-medium">No portfolios yet</h3>
          <Button asChild size="sm" className="mt-4">
            <Link href="/portfolios/new"><Plus className="w-3.5 h-3.5 mr-1.5" />Create Portfolio</Link>
          </Button>
        </div>
      ) : (
        <div className="space-y-2">
          {portfolios.map((p) => (
            <div key={p.id} className="group relative flex items-center gap-4 p-4 bg-card border border-card-border rounded-lg hover:border-border transition-all">
              <div className="w-9 h-9 rounded-md bg-primary/10 border border-primary/20 flex items-center justify-center">
                <TrendingUp className="w-4 h-4 text-primary" />
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2">
                  <span className="font-medium text-sm truncate">{p.name}</span>
                  <Badge variant="outline" className="text-xs font-mono">{p.currency}</Badge>
                </div>
                {p.description && <p className="text-xs text-muted-foreground mt-0.5 truncate">{p.description}</p>}
              </div>
              <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                <Button variant="ghost" size="icon" className="h-7 w-7 text-destructive hover:text-destructive"
                  onClick={(e) => { e.preventDefault(); handleDelete(p.id); }}>
                  <Trash2 className="w-3.5 h-3.5" />
                </Button>
                <Button variant="ghost" size="icon" className="h-7 w-7" asChild>
                  <Link href={`/portfolios/${p.id}`}><ChevronRight className="w-3.5 h-3.5" /></Link>
                </Button>
              </div>
              <Link href={`/portfolios/${p.id}`} className="absolute inset-0" />
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
import { useState } from "react";
import { useLocation, Link } from "wouter";
import { useCreatePortfolio, getListPortfoliosQueryKey } from "@workspace/api-client-react";
import { useQueryClient } from "@tanstack/react-query";
import { Button } from "@/components/ui/button";
import { Input } from "@/components/ui/input";
import { Label } from "@/components/ui/label";
import { Textarea } from "@/components/ui/textarea";
import { Select, SelectContent, SelectItem, SelectTrigger, SelectValue } from "@/components/ui/select";
import { ArrowLeft } from "lucide-react";

const CURRENCIES = ["USD","EUR","GBP","JPY","CAD","AUD","CHF","INR"];

export default function NewPortfolio() {
  const [, navigate] = useLocation();
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [currency, setCurrency] = useState("USD");
  const createPortfolio = useCreatePortfolio();
  const queryClient = useQueryClient();

  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    const portfolio = await createPortfolio.mutateAsync({ data: { name: name.trim(), description: description.trim() || null, currency } });
    queryClient.invalidateQueries({ queryKey: getListPortfoliosQueryKey() });
    navigate(`/portfolios/${portfolio.id}`);
  };

  return (
    <div className="max-w-lg mx-auto space-y-6">
      <div className="flex items-center gap-3">
        <Button variant="ghost" size="icon" className="h-8 w-8" asChild>
          <Link href="/"><ArrowLeft className="w-4 h-4" /></Link>
        </Button>
        <h1 className="text-lg font-semibold">New Portfolio</h1>
      </div>
      <form onSubmit={handleSubmit} className="space-y-4 bg-card border border-card-border rounded-lg p-5">
        <div className="space-y-1.5">
          <Label htmlFor="name" className="text-xs">Portfolio Name</Label>
          <Input id="name" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. My Retirement Fund" className="h-9 text-sm" required />
        </div>
        <div className="space-y-1.5">
          <Label htmlFor="desc" className="text-xs">Description <span className="text-muted-foreground">(optional)</span></Label>
          <Textarea id="desc" value={description} onChange={e => setDescription(e.target.value)} className="text-sm min-h-[70px] resize-none" />
        </div>
        <div className="space-y-1.5">
          <Label className="text-xs">Currency</Label>
          <Select value={currency} onValueChange={setCurrency}>
            <SelectTrigger className="h-9 text-sm"><SelectValue /></SelectTrigger>
            <SelectContent>{CURRENCIES.map(c => <SelectItem key={c} value={c}>{c}</SelectItem>)}</SelectContent>
          </Select>
        </div>
        <div className="flex gap-2 pt-1">
          <Button type="submit" size="sm" disabled={createPortfolio.isPending || !name.trim()} className="flex-1">
            {createPortfolio.isPending ? "Creating..." : "Create Portfolio"}
          </Button>
          <Button type="button" variant="outline" size="sm" asChild><Link href="/">Cancel</Link></Button>
        </div>
      </form>
    </div>
  );
}