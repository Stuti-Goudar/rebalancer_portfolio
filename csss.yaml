export default router;
import { Router, type IRouter } from "express";
import { eq } from "drizzle-orm";
import { db, holdingsTable, targetsTable } from "@workspace/db";
import {
  GetRebalancePlanParams, GetPortfolioSummaryParams,
  GetRebalancePlanResponse, GetPortfolioSummaryResponse,
} from "@workspace/api-zod";

const router: IRouter = Router();

router.get("/portfolios/:portfolioId/rebalance", async (req, res): Promise<void> => {
  const params = GetRebalancePlanParams.safeParse(req.params);
  if (!params.success) { res.status(400).json({ error: params.error.message }); return; }

  const { portfolioId } = params.data;
  const holdings = await db.select().from(holdingsTable).where(eq(holdingsTable.portfolioId, portfolioId));
  const targets = await db.select().from(targetsTable).where(eq(targetsTable.portfolioId, portfolioId));

  const totalValue = holdings.reduce((sum, h) => sum + h.shares * h.currentPrice, 0);
  if (totalValue === 0) {
    res.json(GetRebalancePlanResponse.parse({ totalValue: 0, actions: [], summary: { totalBuys: 0, totalSells: 0, actionsCount: 0 } }));
    return;
  }

  const targetMap = new Map(targets.map((t) => [t.assetClass, t.targetPercent]));

  const actions = holdings.map((holding) => {
    const currentValue = holding.shares * holding.currentPrice;
    const currentPercent = (currentValue / totalValue) * 100;
    const targetPercent = targetMap.get(holding.assetClass) ?? 0;
    const targetValue = (targetPercent / 100) * totalValue;
    const difference = targetValue - currentValue;
    const sharesToTrade = Math.abs(difference / holding.currentPrice);
    let action = "HOLD";
    if (difference > 1) action = "BUY";
    else if (difference < -1) action = "SELL";
    return { ticker: holding.ticker, name: holding.name, assetClass: holding.assetClass, action, currentValue, targetValue, difference, sharesToTrade, currentPercent, targetPercent };
  });

  const totalBuys = actions.filter((a) => a.action === "BUY").reduce((sum, a) => sum + a.difference, 0);
  const totalSells = Math.abs(actions.filter((a) => a.action === "SELL").reduce((sum, a) => sum + a.difference, 0));
  const actionsCount = actions.filter((a) => a.action !== "HOLD").length;

  res.json(GetRebalancePlanResponse.parse({ totalValue, actions, summary: { totalBuys, totalSells, actionsCount } }));
});

router.get("/portfolios/:portfolioId/summary", async (req, res): Promise<void> => {
  const params = GetPortfolioSummaryParams.safeParse(req.params);
  if (!params.success) { res.status(400).json({ error: params.error.message }); return; }

  const { portfolioId } = params.data;
  const holdings = await db.select().from(holdingsTable).where(eq(holdingsTable.portfolioId, portfolioId));
  const targets = await db.select().from(targetsTable).where(eq(targetsTable.portfolioId, portfolioId));

  const totalValue = holdings.reduce((sum, h) => sum + h.shares * h.currentPrice, 0);
  const targetMap = new Map(targets.map((t) => [t.assetClass, t.targetPercent]));
  const assetClassMap = new Map<string, number>();
  for (const h of holdings) {
    const val = h.shares * h.currentPrice;
    assetClassMap.set(h.assetClass, (assetClassMap.get(h.assetClass) ?? 0) + val);
  }
  const allocations = Array.from(assetClassMap.entries()).map(([assetClass, currentValue]) => {
    const currentPercent = totalValue > 0 ? (currentValue / totalValue) * 100 : 0;
    const targetPercent = targetMap.get(assetClass) ?? 0;
    const drift = currentPercent - targetPercent;
    return { assetClass, currentValue, currentPercent, targetPercent, drift };
  });
  const maxDrift = allocations.reduce((max, a) => Math.max(max, Math.abs(a.drift)), 0);
  const isBalanced = maxDrift < 5;

  res.json(GetPortfolioSummaryResponse.parse({ portfolioId, totalValue, holdingsCount: holdings.length, allocations, isBalanced, maxDrift }));
});

